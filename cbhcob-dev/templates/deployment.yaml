apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-demo

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: app-demo

  template:
    metadata:
      labels:
        app: app-demo

    spec:
      imagePullSecrets:
        - name: quay-registry-secret

      containers:
        - name: app-demo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: app-demo-config